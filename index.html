<!DOCTYPE html><html lang="zh-Hant"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧吃藥助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- 頂部標題 -->
    <header class="w-full max-w-md text-center my-6">
        <h1 class="text-3xl font-bold text-blue-600">💊 智慧吃藥助手</h1>
        <p class="text-gray-500 mt-2">App 掃描 NFC 後將自動記錄於此</p>
    </header>

    <!-- 主要操作區 -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 flex-1 flex flex-col justify-between mb-6">
        
        <!-- 狀態顯示 -->
        <div class="text-center my-4">
            <div id="status-icon" class="text-6xl mb-2">📱</div>
            <p id="status-text" class="text-lg font-medium text-gray-700">準備就緒，請使用手機感應藥包</p>
        </div>

        <!-- 吃藥紀錄列表 -->
        <div class="flex-1 overflow-y-auto my-4 max-h-80 border-t border-b border-gray-100 py-2">
            <h3 class="font-semibold text-gray-700 mb-2">今日吃藥紀錄：</h3>
            <ul id="record-list" class="space-y-2">
                <li class="text-gray-400 text-sm text-center py-4">尚無紀錄</li>
            </ul>
        </div>

        <!-- 按鈕控制區 -->
        <div class="space-y-3">
            <button id="clear-btn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-3 px-4 rounded-xl transition duration-200">
                清除所有紀錄
            </button>
        </div>
    </main>

    <script>
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        const recordList = document.getElementById('record-list');
        const clearBtn = document.getElementById('clear-btn');

        // 從 LocalStorage 載入歷史紀錄
        let records = JSON.parse(localStorage.getItem('pill_records')) || [];
        updateRecordList();

        // 更新畫面上的紀錄列表
        function updateRecordList() {
            recordList.innerHTML = '';
            if (records.length === 0) {
                recordList.innerHTML = '<li class="text-gray-400 text-sm text-center py-4">尚無紀錄</li>';
                return;
            }
            records.forEach((rec) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-blue-50 p-3 rounded-lg text-sm text-blue-800 font-medium animate-fade-in";
                li.innerHTML = `
                    <span>💊 ${rec.drugName}</span>
                    <span class="text-xs text-gray-500">${rec.time}</span>
                `;
                recordList.appendChild(li);
            });
        }

        // 新增一筆吃藥紀錄
        function addRecord(drugName) {
            const now = new Date();
            const timeString = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            
            records.unshift({ drugName, time: timeString }); // 新紀錄排在最前面
            localStorage.setItem('pill_records', JSON.stringify(records));
            updateRecordList();

            // 成功的視覺反饋
            statusIcon.innerText = "✅";
            statusText.innerText = `成功記錄！已服用：${drugName}`;
            
            // 3秒後恢復提示狀態
            setTimeout(() => {
                statusIcon.innerText = "📱";
                statusText.innerText = "請使用手機感應藥包...";
            }, 3000);
        }

        // 【核心修改】自動偵測網址參數並記錄
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const drug = urlParams.get('drug'); // 取得網址中 ?drug=xxx 的內容
            
            if (drug) {
                // 為了避免重新整理網頁時重複記錄，我們在記錄完後將網址上的參數拿掉
                addRecord(decodeURIComponent(drug));
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        };

        // 清除紀錄
        clearBtn.addEventListener('click', () => {
            if (confirm("確定要清除所有吃藥紀錄嗎？")) {
                records = [];
                localStorage.removeItem('pill_records');
                updateRecordList();
                statusText.innerText = "紀錄已清空";
            }
        });
    </script>


</body></html>
